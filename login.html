<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Studio Infinite — Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<main class="login-main">
  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/studio-infinite-logo.svg" alt="Studio Infinite LLP" class="login-logo">
      <h1>Site Visit Report</h1>
      <p class="login-sub">Enter credentials to access the form.</p>

      <div class="login-error" id="loginError">Incorrect username or password. Please try again.</div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="export-btn" style="margin-top:6px;">Sign In</button>
      </form>

   
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
